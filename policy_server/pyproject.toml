[project]
name = "smolvla-cf"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "lerobot[smolvla]",
    "openpi-client",
    "websockets>=13",
]

[tool.uv.sources]
lerobot = { path = "../third_party/lerobot", editable = true }
openpi-client = { path = "../third_party/libero-cf/packages/openpi-client" }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smolvla_cf"]
